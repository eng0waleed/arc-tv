name: Build Arc TV

# Builds the Arc TV APK (Arc Launcher + prayer times) and publishes it as a
# GitHub release so the TV can download it directly:
#   https://github.com/eng0waleed/arc-tv/releases/latest/download/arc.apk
# Logs of every run are pushed to the `ci` branch (ci/analyze.txt, ci/build.txt ...).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Prepare log folder
        run: |
          mkdir -p ci-out
          flutter --version > ci-out/flutter-version.txt 2>&1

      - name: flutter pub get
        id: pub
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee ci-out/pub.txt

      - name: flutter analyze
        id: analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ci-out/analyze.txt

      - name: Prayer-time tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test test/prayer 2>&1 | tee ci-out/tests.txt

      # Renders the real launcher screens at 1920x1080 (see test/screenshots).
      - name: Screenshots
        id: screens
        continue-on-error: true
        run: |
          set -o pipefail
          sudo apt-get install -y -qq fonts-noto-core >/dev/null 2>&1 || true
          ls /usr/share/fonts/truetype/noto/ | grep -i arabic > ci-out/arabic-fonts.txt || true
          flutter test --update-goldens test/screenshots 2>&1 | tee ci-out/screens.txt
      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p ci-out/screens
          cp test/screenshots/goldens/*.png ci-out/screens/ 2>/dev/null || true
          ls -la ci-out/screens

      # A stable signing key lets every new build install over the previous one.
      # The key is generated here on the first run, encrypted with the repository
      # secret ARC_TV_SIGNING_SECRET and kept (encrypted) on the `signing` branch.
      - name: Signing key
        id: signing
        env:
          SECRET: ${{ secrets.ARC_TV_SIGNING_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SECRET:-}" ]; then
            echo "Missing repository secret ARC_TV_SIGNING_SECRET: building with a throwaway debug key, not publishing" | tee ci-out/signing.txt
            echo "::warning::Add the repository secret ARC_TV_SIGNING_SECRET (Settings > Secrets and variables > Actions)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          work="$RUNNER_TEMP/signing"
          mkdir -p "$work"
          if git fetch -q --depth 1 origin signing 2>/dev/null; then
            git show FETCH_HEAD:keystore.p12.enc > "$work/keystore.p12.enc"
            echo "Using the existing signing key from the signing branch" | tee ci-out/signing.txt
          else
            keytool -genkeypair -keystore "$work/keystore.p12" -storetype PKCS12 \
              -alias arc-tv -keyalg RSA -keysize 2048 -validity 12000 \
              -storepass:env SECRET -keypass:env SECRET \
              -dname "CN=Arc TV, O=eng0waleed"
            openssl enc -aes-256-cbc -pbkdf2 -iter 300000 -salt \
              -in "$work/keystore.p12" -out "$work/keystore.p12.enc" -pass env:SECRET
            rm -f "$work/keystore.p12"
            mkdir -p "$work/branch"
            cp "$work/keystore.p12.enc" "$work/branch/keystore.p12.enc"
            printf '%s\n' "Encrypted APK signing key for Arc TV builds (AES-256, PBKDF2)." \
              "It can only be decrypted with the ARC_TV_SIGNING_SECRET repository secret." > "$work/branch/README.md"
            git -C "$work/branch" init -q
            git -C "$work/branch" checkout -q -b signing
            git -C "$work/branch" add -A
            git -C "$work/branch" -c user.name="arc-tv-ci" -c user.email="ci@users.noreply.github.com" \
              commit -qm "Encrypted signing key"
            git -C "$work/branch" push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" signing
            echo "Created a new signing key and stored it encrypted on the signing branch" | tee ci-out/signing.txt
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 \
            -in "$work/keystore.p12.enc" -out android/app/upload-keystore.jks -pass env:SECRET
          keytool -list -keystore android/app/upload-keystore.jks -storepass:env SECRET | grep -i fingerprint | tee -a ci-out/signing.txt
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        id: build
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ARC_TV_SIGNING_SECRET }}
          SIGNING_KEY_ALIAS: arc-tv
          SIGNING_KEY_PASSWORD: ${{ secrets.ARC_TV_SIGNING_SECRET }}
        run: |
          set -o pipefail
          BUILD_NUMBER=$((5000 + ${{ github.run_number }}))
          BUILD_NAME="1.2.0-tv.${{ github.run_number }}"
          echo "BUILD_NAME=$BUILD_NAME" >> "$GITHUB_ENV"
          flutter build apk --release --flavor github \
            --dart-define=ENABLE_SELF_UPDATER=true \
            --build-number=$BUILD_NUMBER --build-name=$BUILD_NAME 2>&1 | tee ci-out/build.txt
          mkdir -p dist
          APK=$(find build/app/outputs -name 'arc-launcher-universal-release.apk' | head -n 1)
          test -n "$APK" || { find build/app/outputs -name '*.apk' | tee -a ci-out/build.txt; exit 1; }
          cp "$APK" dist/arc.apk
          cp "$APK" "dist/arc-tv-$BUILD_NAME.apk"
          ls -la dist | tee -a ci-out/build.txt
          sha256sum dist/*.apk | tee ci-out/sha256.txt

      - name: Publish release
        if: steps.build.outcome == 'success' && steps.tests.outcome == 'success' && steps.signing.outputs.signed == 'true' && !contains(github.event.head_commit.message, '[no-release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_NAME }}
          name: Arc TV ${{ env.BUILD_NAME }}
          make_latest: true
          body: |
            Arc Launcher with prayer times (Umm al-Qura), built from ${{ github.sha }}.
            TV download link (always the newest build):
            https://github.com/${{ github.repository }}/releases/latest/download/arc.apk
          files: dist/*

      - name: Push CI logs to the ci branch
        if: always()
        run: |
          cd ci-out
          {
            echo "run=${{ github.run_number }}"
            echo "sha=${{ github.sha }}"
            echo "signing=${{ steps.signing.outcome }} signed=${{ steps.signing.outputs.signed }}"
            echo "pub=${{ steps.pub.outcome }}"
            echo "analyze=${{ steps.analyze.outcome }}"
            echo "tests=${{ steps.tests.outcome }}"
            echo "screens=${{ steps.screens.outcome }}"
            echo "build=${{ steps.build.outcome }}"
          } > status.txt
          # Keep logs small enough to read: last 400 lines of the build log.
          if [ -f build.txt ]; then tail -n 400 build.txt > build-tail.txt; fi
          git init -q .
          git checkout -q -b ci
          git add -A
          git -c user.name="arc-tv-ci" -c user.email="ci@users.noreply.github.com" commit -qm "CI logs for run ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci
